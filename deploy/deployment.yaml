apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-graph-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-graph-frontend
  template:
    metadata:
      labels:
        app: kube-state-graph-frontend
    spec:
      # The front door calls no Kubernetes API; a mounted token would only be something
      # for a compromised process to use.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/example/kube-state-graph-frontend:main
          # `main` moves on every push, so re-resolve it at every Pod start. Pin a digest
          # instead (see deploy/README.md) and IfNotPresent is safe again.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          # Optional same-origin reverse proxies. Two upstreams, because the graph API
          # does not serve `/api/v1/label/<name>/values` — `endpoints.labelValues` needs a
          # Prometheus-compatible store or the az / env and filter controls enumerate
          # nothing. Unset targets serve 404 on their own prefix and nothing else. Both
          # forward GET/HEAD only, and the metrics proxy forwards `/api/v1/label/` and
          # nothing else — the store's query and export APIs stay unreachable from a browser.
          # env:
          #   - name: KSG_API_PROXY_TARGET
          #     value: http://kube-state-graph.monitoring.svc:8080
          #   - name: KSG_METRICS_PROXY_TARGET
          #     value: http://vmselect.monitoring.svc:8481/select/0/prometheus
          #   # Must equal the backend's --az-label / --env-label. The SPA still
          #   # requests logical `az` / `env`; the front door rewrites the label-values path.
          #   - name: KSG_AZ_LABEL
          #     value: az
          #   - name: KSG_ENV_LABEL
          #     value: env
          volumeMounts:
            - name: config
              mountPath: /srv/config
              readOnly: true
            # The root filesystem is read-only: the generated proxy config, the pid file
            # and nginx's temp files are the only things the container writes.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: config
          configMap:
            name: kube-state-graph-frontend
        - name: tmp
          emptyDir: {}
