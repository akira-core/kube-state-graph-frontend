# Browser-facing security headers, included by every location in nginx.conf and in the
# proxies docker/entrypoint.sh generates. nginx does not inherit add_header into a block
# that declares its own, so each of those blocks must include this file itself.
#
# CSP: scripts and everything else load from this origin only, with two deliberate openings.
# - style-src admits inline styles. Libraries in the bundle create <style> elements at
#   runtime, and under 'self' alone the browser blocks every one of them (style-src-elem
#   violations on both /graph and /sankey). A hash list would have to track every library
#   upgrade; scripts get no such exception.
# - img-src takes data:, because the graph canvas draws its node icons from
#   data:image/svg+xml URIs.
# connect-src admits any http(s) origin because runtime config may point an endpoint at an
# absolute cross-origin URL — the policy guards what may run here, not where the app may
# fetch from.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
