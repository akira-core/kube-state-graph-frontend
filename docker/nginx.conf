worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    # No version in the Server header or on nginx's own error pages.
    server_tokens off;

    # This file replaces the base image's, which is where these pointed at /tmp. Without
    # them nginx falls back to its compiled-in /var/cache/nginx, which a read-only root
    # filesystem cannot provide — /tmp is the only writable path the Deployment mounts.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $spa_cache {
        default "no-cache";
        ~*^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        # Every location below includes this again: nginx does not inherit add_header into
        # a block that declares its own, and each of them does (Cache-Control).
        include /etc/nginx/security-headers.conf;

        location = /healthz {
            # Content-Type comes from default_type, never add_header: add_header APPENDS,
            # so pairing it with a body nginx already typed emits TWO Content-Type headers.
            default_type text/plain;
            add_header Cache-Control no-store always;
            include /etc/nginx/security-headers.conf;
            return 200 "ok\n";
        }

        location = /config.json {
            alias /srv/config/config.json;
            # default_type only — an add_header Content-Type here would be a SECOND
            # Content-Type header on every /config.json response.
            default_type application/json;
            add_header Cache-Control no-store always;
            include /etc/nginx/security-headers.conf;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        include /tmp/api_proxy.conf;
        include /tmp/metrics_proxy.conf;

        # The demo payloads — `/demo/graph.json`, `/demo/storage-graph.json` and
        # `/demo/trace.json` — fall through here and inherit no-cache (they are not
        # content-hashed).
        location / {
            add_header Cache-Control no-cache always;
            include /etc/nginx/security-headers.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
