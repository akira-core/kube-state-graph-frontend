worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    map $uri $spa_cache {
        default "no-cache";
        ~*^/assets/ "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        absolute_redirect off;

        add_header X-Content-Type-Options nosniff always;

        location = /healthz {
            # Content-Type comes from default_type, never add_header: add_header APPENDS,
            # so pairing it with a body nginx already typed emits TWO Content-Type headers.
            default_type text/plain;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
            return 200 "ok\n";
        }

        location = /config.json {
            alias /srv/config/config.json;
            # default_type only — an add_header Content-Type here would be a SECOND
            # Content-Type header on every /config.json response.
            default_type application/json;
            add_header Cache-Control no-store always;
            add_header X-Content-Type-Options nosniff always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri =404;
        }

        include /tmp/api_proxy.conf;

        location / {
            add_header Cache-Control no-cache always;
            add_header X-Content-Type-Options nosniff always;
            try_files $uri $uri/ /index.html;
        }
    }
}
