name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository, and `npm ci` runs third-party install scripts
# with whatever this token grants.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA — a tag can be force-pushed to new code, a SHA
      # cannot. Dependabot moves each SHA and its version comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fixture:check
      - run: npm run test:ci
      - run: npm run e2e
      - run: npm run build
