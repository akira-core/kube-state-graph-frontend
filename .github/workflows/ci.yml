name: ci

on:
  pull_request:
  push:
    branches: [main]

# Nothing here writes to the repository, and `npm ci` runs third-party install scripts
# with whatever this token grants.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned by full commit SHA — a tag can be force-pushed to new code, a SHA
      # cannot. Dependabot moves each SHA and its version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run fixture:check
      - run: npm run test:ci
      - run: npm run e2e
      - run: npm run build
