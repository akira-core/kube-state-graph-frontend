name: image

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Build once into the runner's daemon so the scan sees the exact bytes that
      # would be pushed. The push below re-uses this builder's layer cache, so it
      # costs an export, not a rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: kube-state-graph-frontend:scan

      # Gate: any vulnerability with a fix available fails the job, on every
      # severity. Unfixed ones are reported but do not block — nothing in this
      # repository can remove them short of dropping the package. Accept a known
      # finding by listing its CVE id in a `.trivyignore` at the repository root.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: kube-state-graph-frontend:scan
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - uses: docker/build-push-action@v6
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
