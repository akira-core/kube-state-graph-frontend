# Both Dockerfile bases are pinned by digest (see the comments there). A digest
# pin only stays CVE-free while something moves it, and this is that something:
# a weekly PR bumping tag + digest together, which the `image` workflow's Trivy
# gate then scans before anything is pushed.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ['*']
  # Workflow actions are pinned by commit SHA (see the workflows). This moves each pin
  # and its `# vX.Y.Z` comment together, weekly, as one reviewable PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
